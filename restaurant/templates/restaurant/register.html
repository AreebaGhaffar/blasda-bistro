{% extends "restaurant/base.html" %}

{% block title %}Register · {{ site.restaurant_name }}{% endblock %}

{% block content %}
<section class="wrap narrow">
  <h1>Create your account</h1>
  <form method="post" class="form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Register</button>
  </form>
  <p>Already registered? <a href="{% url 'restaurant:login' %}">Log in</a></p>
</section>
{% endblock %}
