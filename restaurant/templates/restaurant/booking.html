{% extends "restaurant/base.html" %}

{% block title %}Book a table · {{ site.restaurant_name }}{% endblock %}

{% block content %}
<section class="wrap narrow">

  <p class="ga">Cuir bord in áirithe</p>

    {{ form.as_p }}

  </form>
</section>
{% endblock %}
